<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saans — Urban Air Quality Assistant</title>
    <meta name="description" content="AI-powered and deterministic air quality assistant for winter smog and urban health." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply persisted font scale and contrast before first paint to prevent layout flash
      try {
        const savedContrast = localStorage.getItem("saans.contrast");
        if (savedContrast === "high") {
          document.documentElement.setAttribute("data-contrast", "high");
        }
        const savedScale = localStorage.getItem("saans.fontScale");
        if (savedScale) {
          document.documentElement.style.fontSize = savedScale;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-emerald-600 focus:text-white focus:rounded-md focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-emerald-400">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

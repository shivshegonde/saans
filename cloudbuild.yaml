steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-sql-copilot/saans/saans-app:$BUILD_ID'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-sql-copilot/saans/saans-app:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/ai-builder-sql-copilot/saans/saans-app:latest'

  # 3. Deploy to Cloud Run in asia-south1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saans'
      - '--image=asia-south1-docker.pkg.dev/ai-builder-sql-copilot/saans/saans-app:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=ai-builder-sql-copilot,GCP_REGION=asia-south1,FIRESTORE_DATABASE=saans,DEMO_MODE=true'

images:
  - 'asia-south1-docker.pkg.dev/ai-builder-sql-copilot/saans/saans-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
